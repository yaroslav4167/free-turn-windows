name: Release Windows client

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - run: npm --prefix desktop/frontend ci
      - name: Build and check Windows desktop
        working-directory: desktop
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          wails build -ldflags "-checklinkname=0 -s -w -X main.desktopVersion=$env:RELEASE_TAG -X main.updateRepository=$env:UPDATE_REPOSITORY" -trimpath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Windows release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force dist/package | Out-Null
          Copy-Item desktop/build/bin/freeturn-desktop.exe dist/package/
          Copy-Item scripts/windows/install.ps1,scripts/windows/uninstall.ps1 dist/package/
          Copy-Item scripts/windows/Install.cmd,scripts/windows/Uninstall.cmd,scripts/windows/Run_Admin.bat dist/package/
          Copy-Item README.md,LICENSE dist/package/
          Copy-Item docs -Destination dist/package/docs -Recurse
          Compress-Archive -Path dist/package/* -DestinationPath "dist/FreeTurn-Windows-amd64-$env:RELEASE_TAG.zip"
          $archive = "FreeTurn-Windows-amd64-$env:RELEASE_TAG.zip"
          $hash = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Set-Content dist/checksums.txt -Encoding utf8NoBOM
      - uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: FreeTurn Windows ${{ inputs.tag || github.ref_name }}
          files: |
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true
