name: Build Linux desktop

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Build and package desktop client
        env:
          UPDATE_REPOSITORY: ${{ github.repository }}
        run: sh packaging/linux/build-desktop.sh
      - name: Check frontend
        working-directory: desktop/frontend
        run: |
          npx --no-install tsc --noEmit
          npm test
      - name: Check Go packages
        run: |
          go test ./desktop/... ./internal/session ./mobile
          go test -race ./internal/session ./mobile ./desktop/backend
          go vet ./desktop/... ./internal/session ./mobile
      - name: Upload Linux download
        uses: actions/upload-artifact@v7.0.2
        with:
          name: FreeTurn-Linux-amd64
          path: |
            dist/FreeTurn-Linux-amd64.tar.gz
            dist/FreeTurn-Linux-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
