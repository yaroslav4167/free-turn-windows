name: Windows desktop checks

on:
  push:
    branches: ['feat/windows-desktop-experience']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci
      - name: Check frontend
        working-directory: desktop/frontend
        run: |
          npx --no-install tsc --noEmit
          npm test
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - name: Build desktop
        working-directory: desktop
        env:
          UPDATE_REPOSITORY: ${{ github.repository }}
        run: wails build -ldflags "-checklinkname=0 -s -w -X main.updateRepository=$env:UPDATE_REPOSITORY" -trimpath
      - name: Test core and backend
        run: go test -race ./internal/session ./mobile ./desktop/...
      - name: Vet core and backend
        run: go vet ./internal/session ./mobile ./desktop/...
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: FreeTurn-Windows-test
          path: desktop/build/bin/freeturn-desktop.exe
          if-no-files-found: error
